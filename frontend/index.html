    <!-- ?v= busts Safari's sticky favicon cache; PNGs first because Safari ignores SVG tab icons. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=3" />

    <meta name="theme-color" content="#f6f7f6" />
    <!-- Apply the saved theme and language before the first paint, so a dark page never flashes white. -->
    <script>
      (function () {
        try {
          var root = document.documentElement
          var saved = localStorage.getItem('theme')
          var dark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          root.setAttribute('data-theme', dark ? 'dark' : 'light')
          root.style.colorScheme = dark ? 'dark' : 'light'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0b1110' : '#f6f7f6')
          var language = (localStorage.getItem('kanban-language') || '').slice(0, 2)
          if (/^(en|uk|ru)$/.test(language)) root.setAttribute('lang', language)
        } catch (error) {}
      })()
    </script>
    <style>
      html { background: #f6f7f6; }
      html[data-theme='dark'] { background: #0b1110; }
    </style>

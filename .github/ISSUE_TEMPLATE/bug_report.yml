name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it
      placeholder: |
        1. Open a board
        2. Drag a card to ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where do you use KanbanHub?
      options:
        - kanbanhub.app
        - My own copy (Docker)
        - Local development
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on macOS, Safari on iPhone 15, ...
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Drag images here. For your own copy, `docker compose logs app` often helps.
